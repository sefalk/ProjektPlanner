<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Calendar base -->
  <rect x="3" y="6" width="26" height="23" rx="3" fill="#2563eb"/>
  <!-- Calendar top bar -->
  <rect x="3" y="6" width="26" height="8" rx="3" fill="#1d4ed8"/>
  <rect x="3" y="11" width="26" height="3" fill="#1d4ed8"/>
  <!-- Ring hooks -->
  <rect x="10" y="3" width="3" height="6" rx="1.5" fill="#93c5fd"/>
  <rect x="19" y="3" width="3" height="6" rx="1.5" fill="#93c5fd"/>
  <!-- Grid dots (days) -->
  <rect x="7"  y="19" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="12" y="19" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="17" y="19" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="22" y="19" width="3" height="3" rx="0.5" fill="#bfdbfe" opacity="0.9"/>
  <rect x="7"  y="24" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
  <rect x="12" y="24" width="3" height="3" rx="0.5" fill="#60a5fa" opacity="0.9"/>
  <rect x="17" y="24" width="3" height="3" rx="0.5" fill="#60a5fa" opacity="0.9"/>
  <rect x="22" y="24" width="3" height="3" rx="0.5" fill="white" opacity="0.9"/>
</svg>
